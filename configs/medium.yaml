# configs/medium.yaml
# ─────────────────────────────────────────────────────────────────────────────
# "Medium" preset — larger model for better quality, needs more VRAM/time.
# Gradient accumulation (accum_steps=4) gives an effective batch of 128
# while keeping memory low.
#
# Approx parameter count (with weight tying):
#   ~8 M parameters
# Rough training time:
#   CPU:  several hours for 10 000 steps
#   GPU:  ~20–40 min (GPU strongly recommended for this config)
# ─────────────────────────────────────────────────────────────────────────────

model:
  block_size: 512
  n_embd: 256
  n_head: 8
  n_layer: 6
  dropout: 0.1
  weight_tying: true

train:
  steps: 10000
  batch_size: 32
  accum_steps: 4
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 200
  grad_clip: 1.0
  eval_interval: 500
  save_interval: 2000
  sample_interval: 1000
  use_amp: true
  tokenizer: char
